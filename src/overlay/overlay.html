<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'">
  <title>Snapit — sélection</title>

    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #000;

      inset: 0;
      width: 100vw;
      height: 100vh;
      display: block;
    }

  <img id="shot" alt="" draggable="false">
  <canvas id="fx"></canvas>
  <script src="overlay.js"></script>
