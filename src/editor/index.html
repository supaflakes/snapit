<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Snapit</title>
  <link rel="stylesheet" href="../theme.css">
  <link rel="stylesheet" href="editor.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-capture" viewBox="0 0 24 24"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/><circle cx="12" cy="12" r="3"/></symbol>
      <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
      <symbol id="i-select" viewBox="0 0 24 24"><path d="M5 4.5 11 20l2.2-6.8L20 11z"/></symbol>
      <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 19 19 5M9.5 5H19v9.5"/></symbol>
      <symbol id="i-rect" viewBox="0 0 24 24"><rect x="4" y="5.5" width="16" height="13" rx="1.5"/></symbol>
      <symbol id="i-ellipse" viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="8.5" ry="6.5"/></symbol>
      <symbol id="i-line" viewBox="0 0 24 24"><path d="M5 19 19 5"/></symbol>
      <symbol id="i-pen" viewBox="0 0 24 24"><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7.5 18.5 3.5 20l1.5-4z"/></symbol>
      <symbol id="i-marker" viewBox="0 0 24 24"><path d="m9 11-6 6v3h9l3-3"/><path d="m22 12-4.6 4.6a2 2 0 0 1-2.8 0l-5.2-5.2a2 2 0 0 1 0-2.8L14 4"/></symbol>
      <symbol id="i-text" viewBox="0 0 24 24"><path d="M5 7V5h14v2M12 5v14M9 19h6"/></symbol>
      <symbol id="i-step" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M10.5 9.5 12.5 8v8"/></symbol>
      <symbol id="i-blur" viewBox="0 0 24 24"><path fill="currentColor" stroke="none" d="M4 4h4v4H4zM12 4h4v4h-4zM8 8h4v4H8zM16 8h4v4h-4zM4 12h4v4H4zM12 12h4v4h-4zM8 16h4v4H8zM16 16h4v4h-4z"/></symbol>
      <symbol id="i-crop" viewBox="0 0 24 24"><path d="M6 2v14a2 2 0 0 0 2 2h14"/><path d="M18 22V8a2 2 0 0 0-2-2H2"/></symbol>
      <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></symbol>
      <symbol id="i-redo" viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></symbol>
      <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="13" height="13" rx="2"/><path d="M4 16V5a1 1 0 0 1 1-1h11"/></symbol>
      <symbol id="i-save" viewBox="0 0 24 24"><path d="M12 3v12m0 0 4.5-4.5M12 15l-4.5-4.5M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></symbol>
      <symbol id="i-monitor" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></symbol>
      <symbol id="i-timer" viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M9 2h6"/></symbol>
      <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
      <symbol id="i-paste" viewBox="0 0 24 24"><rect x="6" y="4" width="12" height="17" rx="2"/><path d="M9 4V3h6v1"/></symbol>
      <symbol id="i-fit" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></symbol>
      <symbol id="i-head-end" viewBox="0 0 24 24"><path d="M4 12h15M14 7l5 5-5 5"/></symbol>
      <symbol id="i-head-start" viewBox="0 0 24 24"><path d="M20 12H5M10 7l-5 5 5 5"/></symbol>
      <symbol id="i-head-both" viewBox="0 0 24 24"><path d="M5 12h14M9 8l-4 4 4 4M15 8l4 4-4 4"/></symbol>
      <symbol id="i-head-none" viewBox="0 0 24 24"><path d="M4 12h16"/></symbol>
      <symbol id="i-hs-filled" viewBox="0 0 24 24"><path d="M3 12h9"/><path d="M12 6.5 20 12l-8 5.5z" fill="currentColor"/></symbol>
      <symbol id="i-hs-open" viewBox="0 0 24 24"><path d="M3 12h16M13.5 6.5 19 12l-5.5 5.5"/></symbol>
      <symbol id="i-hs-dot" viewBox="0 0 24 24"><path d="M3 12h12"/><circle cx="17" cy="12" r="3.2" fill="currentColor"/></symbol>
      <symbol id="i-taper" viewBox="0 0 24 24"><path d="M3 12.6 14.5 10.8V6.5L21 12l-6.5 5.5v-4.3z" fill="currentColor" stroke="none"/></symbol>
      <symbol id="i-dash-solid" viewBox="0 0 24 24"><path d="M3 12h18"/></symbol>
      <symbol id="i-dash-dashed" viewBox="0 0 24 24"><path d="M3 12h4.5M10 12h4.5M17 12h4"/></symbol>
      <symbol id="i-dash-dotted" viewBox="0 0 24 24"><path d="M4 12h.01M8 12h.01M12 12h.01M16 12h.01M20 12h.01" stroke-width="3"/></symbol>
      <symbol id="i-shadow" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="12" height="12" rx="2"/><path d="M19.5 8v9.5a2 2 0 0 1-2 2H8" stroke-width="3" opacity=".45"/></symbol>
      <symbol id="i-step-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/></symbol>
      <symbol id="i-step-square" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="4"/></symbol>
      <symbol id="i-blur-soft" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" opacity=".3"/><circle cx="12" cy="12" r="5.5" opacity=".6"/><circle cx="12" cy="12" r="2.5"/></symbol>
      <symbol id="i-bold" viewBox="0 0 24 24"><path d="M7 5h6a3.5 3.5 0 0 1 0 7H7zM7 12h7a3.5 3.5 0 0 1 0 7H7z" stroke-width="2.4"/></symbol>
      <symbol id="i-italic" viewBox="0 0 24 24"><path d="M10 5h8M6 19h8M14 5l-4 14"/></symbol>
      <symbol id="i-reset" viewBox="0 0 24 24"><path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1L3.5 8.5"/><path d="M3.5 3.5v5h5"/></symbol>
      <symbol id="i-settings" viewBox="0 0 24 24"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></symbol>
      <symbol id="i-plus-circle" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
      <symbol id="i-minus" viewBox="0 0 24 24"><path d="M6 12h12"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M6 12h12M12 6v12"/></symbol>
      <symbol id="i-gallery" viewBox="0 0 24 24"><rect x="3" y="3.5" width="18" height="12" rx="2"/><path fill="currentColor" stroke="none" d="M3 18.5h5v2.5H3zM9.5 18.5h5v2.5h-5zM16 18.5h5v2.5h-5z"/></symbol>
    </defs>
  </svg>

  <header class="toolbar">
    <div class="group capture-group">
      <button class="btn primary" id="btn-capture" data-i18n-tip="editor.captureTip">
        <svg class="icon"><use href="#i-capture"/></svg><span data-i18n="editor.capture">Capturer</span>
      </button>
      <button class="btn primary chevron" id="btn-capture-menu" aria-haspopup="menu" aria-expanded="false" data-i18n-label="editor.moreModes">
        <svg class="icon"><use href="#i-chevron"/></svg>
      </button>
      <div class="menu" id="capture-menu" role="menu" hidden>
        <button role="menuitem" data-action="capture-region"><svg class="icon"><use href="#i-capture"/></svg><span data-i18n="menu.region">Capturer une zone</span><kbd data-shortcut="region"></kbd></button>
        <button role="menuitem" data-action="capture-fullscreen"><svg class="icon"><use href="#i-monitor"/></svg><span data-i18n="menu.fullscreen">Capturer l'écran entier</span><kbd data-shortcut="fullscreen"></kbd></button>
        <button role="menuitem" data-action="capture-delay"><svg class="icon"><use href="#i-timer"/></svg><span id="menu-delay">Capture différée (3 s)</span><kbd data-shortcut="delay"></kbd></button>
        <hr>
        <button role="menuitem" data-action="open"><svg class="icon"><use href="#i-folder"/></svg><span data-i18n="menu.open">Ouvrir une image…</span><kbd>Ctrl+O</kbd></button>
        <button role="menuitem" data-action="paste"><svg class="icon"><use href="#i-paste"/></svg><span data-i18n="menu.paste">Coller une image</span><kbd>Ctrl+V</kbd></button>
      </div>
    </div>

    <div class="divider"></div>

    <div class="group tools needs-image" role="toolbar" data-i18n-label="editor.tools">
      <button class="btn tool" data-tool="select"><svg class="icon"><use href="#i-select"/></svg></button>
      <button class="btn tool" data-tool="arrow"><svg class="icon"><use href="#i-arrow"/></svg></button>
      <button class="btn tool" data-tool="rect"><svg class="icon"><use href="#i-rect"/></svg></button>
      <button class="btn tool" data-tool="ellipse"><svg class="icon"><use href="#i-ellipse"/></svg></button>
      <button class="btn tool" data-tool="line"><svg class="icon"><use href="#i-line"/></svg></button>
      <button class="btn tool" data-tool="pen"><svg class="icon"><use href="#i-pen"/></svg></button>
      <button class="btn tool" data-tool="marker"><svg class="icon"><use href="#i-marker"/></svg></button>
      <button class="btn tool" data-tool="text"><svg class="icon"><use href="#i-text"/></svg></button>
      <button class="btn tool" data-tool="step"><svg class="icon"><use href="#i-step"/></svg></button>
      <button class="btn tool" data-tool="blur"><svg class="icon"><use href="#i-blur"/></svg></button>
      <button class="btn tool" data-tool="crop"><svg class="icon"><use href="#i-crop"/></svg></button>
    </div>

    <div class="spacer"></div>

    <div class="group needs-image">
      <button class="btn" id="btn-undo" data-i18n-tip="editor.undo" data-i18n-label="editor.undo"><svg class="icon"><use href="#i-undo"/></svg></button>
      <button class="btn" id="btn-redo" data-i18n-tip="editor.redo" data-i18n-label="editor.redo"><svg class="icon"><use href="#i-redo"/></svg></button>
      <button class="btn" id="btn-delete" data-i18n-tip="editor.delete" data-i18n-label="editor.delete"><svg class="icon"><use href="#i-trash"/></svg></button>
    </div>

    <div class="divider"></div>

    <div class="group">
      <button class="btn labeled needs-image" id="btn-copy" data-i18n-tip="editor.copyTip"><svg class="icon"><use href="#i-copy"/></svg><span data-i18n="editor.copy">Copier</span></button>
      <button class="btn labeled needs-image" id="btn-save" data-i18n-tip="editor.saveTip"><svg class="icon"><use href="#i-save"/></svg><span data-i18n="editor.save">Enregistrer</span></button>
      <button class="btn tip-left" id="btn-settings" data-i18n-tip="editor.settings" data-i18n-label="editor.settings"><svg class="icon"><use href="#i-settings"/></svg></button>
    </div>
  </header>

  <div class="popover" id="color-popover" role="dialog" data-i18n-label="popover.label" hidden>
    <div class="popover-swatches" id="popover-swatches"></div>
    <div class="popover-row">
      <button class="none-btn" id="popover-none" type="button"><span class="swatch-none"></span><span data-i18n="popover.none">Aucun</span></button>
      <label class="custom-btn"><span class="custom-color"></span><span data-i18n="popover.custom">Personnalisée</span><input type="color" id="popover-custom"></label>
    </div>
  </div>

  <div class="workspace">
  <main id="stage">
    <div id="canvas-wrap">
      <canvas id="canvas"></canvas>
      <textarea id="text-editor" spellcheck="false" wrap="off" hidden></textarea>
      <!-- poignées de rognage, comme dans Paint -->
      <div class="crop-handle" data-edge="nw"></div>
      <div class="crop-handle" data-edge="n"></div>
      <div class="crop-handle" data-edge="ne"></div>
      <div class="crop-handle" data-edge="e"></div>
      <div class="crop-handle" data-edge="se"></div>
      <div class="crop-handle" data-edge="s"></div>
      <div class="crop-handle" data-edge="sw"></div>
      <div class="crop-handle" data-edge="w"></div>
    </div>

    <section id="empty" aria-labelledby="empty-title">
      <div class="empty-card">
        <img src="../../assets/icon.png" alt="" width="64" height="64">
        <h1 id="empty-title" data-i18n="empty.title">Capturez, annotez, partagez</h1>
        <p data-i18n="empty.text">Sélectionnez une zone de l'écran, puis ajoutez flèches, textes, étapes numérotées ou zones pixelisées.</p>
        <div class="empty-actions">
          <button class="btn primary big" data-action="capture-region"><svg class="icon"><use href="#i-capture"/></svg><span data-i18n="empty.region">Capturer une zone</span></button>
          <button class="btn big" data-action="capture-fullscreen"><svg class="icon"><use href="#i-monitor"/></svg><span data-i18n="empty.fullscreen">Écran entier</span></button>
          <button class="btn big" data-action="open"><svg class="icon"><use href="#i-folder"/></svg><span data-i18n="empty.open">Ouvrir une image</span></button>
        </div>
        <p class="empty-hint" id="empty-hint">Vous pouvez aussi coller une image (Ctrl+V) ou la glisser ici.</p>
      </div>
    </section>

    <div id="drop-hint" data-i18n="editor.drop" hidden>Déposez l'image pour l'ouvrir</div>
  </main>

  <aside class="panel" id="propsbar" data-i18n-label="panel.label">
    <div class="panel-head">
      <div class="props-title" id="props-title"></div>
      <button class="btn mini" id="btn-reset-style" data-i18n-title="panel.reset" data-i18n-label="panel.reset" hidden>
        <svg class="icon"><use href="#i-reset"/></svg>
      </button>
    </div>
    <div class="presets" id="presets" hidden>
      <div class="presets-head"><span class="prop-label" data-i18n="presets.title">Préréglages</span></div>
      <div class="preset-list" id="preset-list"></div>
    </div>
    <div class="props-controls" id="props-controls"></div>
  </aside>
  </div>

  <footer class="statusbar">
    <span id="status-size"></span>
    <span id="status-hint" class="hint"></span>
    <div class="zoom needs-image">
      <button class="btn mini" id="btn-zoom-out" data-i18n-label="editor.zoomOut"><svg class="icon"><use href="#i-minus"/></svg></button>
      <button class="zoom-label" id="zoom-label" data-i18n-tip="editor.zoomActual">100 %</button>
      <button class="btn mini" id="btn-zoom-in" data-i18n-label="editor.zoomIn"><svg class="icon"><use href="#i-plus"/></svg></button>
      <button class="btn mini" id="btn-zoom-fit" data-i18n-tip="editor.zoomFit" data-i18n-label="editor.zoomFit"><svg class="icon"><use href="#i-fit"/></svg></button>
    </div>
    <button class="btn mini tip-left" id="btn-gallery" aria-pressed="false" data-i18n-tip="editor.gallery" data-i18n-label="editor.gallery" hidden><svg class="icon"><use href="#i-gallery"/></svg></button>
  </footer>

  <!-- galerie des captures enregistrées, comme le plateau de Snagit -->
  <section class="gallery" id="gallery" data-i18n-label="gallery.label" hidden>
    <div class="gallery-head">
      <div class="gallery-title"><span data-i18n="gallery.title">Captures</span><span class="gallery-count" id="gallery-count">0</span></div>
      <button class="btn" id="btn-gallery-folder" data-i18n-tip="gallery.openFolder"><svg class="icon"><use href="#i-folder"/></svg><span data-i18n="gallery.folder">Dossier</span></button>
    </div>
    <div class="gallery-strip" id="gallery-strip">
      <div class="gallery-list" id="gallery-list" role="list"></div>
      <p class="gallery-empty" id="gallery-empty" hidden></p>
    </div>
  </section>

  <div id="toast" role="status" aria-live="polite"></div>
  <input type="file" id="file-input" accept="image/*" hidden>

  <script src="../i18n.js"></script>
  <script src="shapes.js"></script>
  <script src="editor.js"></script>
</body>
</html>
